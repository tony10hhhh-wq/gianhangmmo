      font-family: 'Inter', sans-serif;
      color: #eceff8;
      padding: 20px 16px 70px 16px;
      min-height: 100vh;
    }

    .glow-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .glow-bg::before, .glow-bg::after {
      content: "";
      position: absolute;
      width: 60%;
      height: 60%;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.4;
    }
    .glow-bg::before { background: #bd7b2c; top: -20%; left: -20%; }
    .glow-bg::after { background: #1e4b7c; bottom: -20%; right: -20%; }

    .container { max-width: 1600px; margin: 0 auto; position: relative; z-index: 2; }

    .hero { text-align: center; margin-bottom: 32px; }
    .hero h1 {
      font-size: clamp(38px, 7vw, 78px); font-weight: 800;
      background: linear-gradient(135deg, #FFE6B0 0%, #FFB347 60%, #FF8C42 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 8px;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.06); backdrop-filter: blur(16px);

      font-size: 1.2rem; font-weight: 700; color: #FFD966;
    }
    .admin-badge {
      background: #FFB347; color: #0c0f1e; font-size: 0.7rem;
      padding: 4px 12px; border-radius: 40px; margin-left: 12px; font-weight: bold;
      vertical-align: middle;
    }

    .dashboard { display: flex; gap: 20px; flex-wrap: wrap; }
    .sidebar {
      flex: 1.2; min-width: 250px;
      background: rgba(12,18,32,0.65); backdrop-filter: blur(14px);
      border-radius: 36px; border: 1px solid rgba(255,200,100,0.25);
      padding: 20px 12px; height: fit-content; position: sticky; top: 12px;
    }
    .main { flex: 3.5; min-width: 260px; }

    .cat-btn {
      display: flex; align-items: center; gap: 14px; background: transparent;
      border: none; font-family: 'Inter'; font-size: 0.95rem; font-weight: 600;
      padding: 12px 16px; border-radius: 28px; color: #cdd9ff; cursor: pointer;
      width: 100%; text-align: left; transition: 0.2s;

    .cat-btn i { width: 28px; font-size: 1.2rem; }
    .cat-btn:hover, .cat-btn:active { background: rgba(255,190,80,0.12); color: #FFDE9C; transform: translateX(4px); }
    .cat-btn.active { background: linear-gradient(95deg, #e09d3e20, #ffb34720); border-left: 3px solid #FFB347; color: #FFE2A4; }

    .section-card {
      background: rgba(10,14,27,0.7); backdrop-filter: blur(16px);
      border-radius: 40px; border: 1px solid rgba(255,200,130,0.25);
      margin-bottom: 28px; overflow: hidden;
    }
    .section-header {

    .header-left { display: flex; align-items: center; gap: 14px; }

    .header-left h2 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(120deg, #fff3cf, #ffcd94); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .items-grid { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .price-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,200,120,0.2);
      border-radius: 24px; padding: 14px 18px; transition: 0.2s;

    .price-item.out-of-stock .item-price { text-decoration: line-through; opacity: 0.6; }
    .item-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .item-name { font-weight: 600; font-size: 1rem; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; flex: 1; }
    .item-price { font-weight: 800; font-size: 1.4rem; background: linear-gradient(125deg, #FFD58C, #FFA041); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
    .desc-text { margin-top: 10px; font-size: 0.8rem; color: #aab3e6; padding-left: 28px; }
    
    .admin-controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; justify-content: flex-end; border-top: 1px solid rgba(255,200,100,0.2); padding-top: 12px; flex-wrap: wrap; }

    .edit-btn:hover, .delete-btn:hover { background: #ffb34730; color: #FFB347; }
    .add-product-btn { background: rgba(255,180,70,0.15); border: 1px dashed #FFB347; color: #FFD966; padding: 12px; border-radius: 28px; text-align: center; cursor: pointer; margin-top: 10px; font-weight: 600; }
    
    .bank-card { background: linear-gradient(145deg, #2b2218, #1f1910); border: 1px solid #ffbe6e; border-radius: 24px; }
    .bank-inner { background: #fef7e8; border-radius: 24px; padding: 20px; color: #2a2418; }
    .account-number { font-size: 1.8rem; font-weight: 800; font-family: monospace; background: #eee4d4; display: inline-block; padding: 6px 18px; border-radius: 50px; margin: 10px 0; letter-spacing: 1px; }

    .contact-section { margin-top: 24px; border-top: 1px solid rgba(255,200,100,0.3); padding-top: 18px; }
    .contact-title { font-size: 0.85rem; letter-spacing: 2px; color: #FFB347; margin-bottom: 14px; text-align: center; }
    .zalo-btn, .group-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      border-radius: 60px; padding: 10px 12px; margin-bottom: 10px;
      text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: 0.2s;

    .zalo-btn { background: #0066ff20; border: 1px solid #0066ff; color: #ffdd99; }
    .zalo-btn:hover { background: #0066ff40; }
    .group-btn { background: #1f6b3e20; border: 1px solid #2d9b5e; color: #ffdd99; }
    .group-btn:hover { background: #2a9d8f30; }

    /* Floating scroll top + settings */
    .float-tools {
      position: fixed; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 12px; z-index: 1000;
    }
    .admin-float-btn, .scroll-top-btn {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: 0.2s; border: none;

    .scroll-top-btn { background: #2a2f45; color: #FFD966; border: 1px solid #ffb34780; }
    .admin-float-btn:hover, .scroll-top-btn:hover { transform: scale(1.05); }

    /* Modals */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1200;
      align-items: center; justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #151e2c; border-radius: 40px; padding: 28px; width: 90%; max-width: 480px;
      border: 1px solid #FFB347; max-height: 85vh; overflow-y: auto;

      width: 100%; padding: 12px; margin: 8px 0; border-radius: 24px; border: none;
      background: #0b1020; color: white; font-family: inherit;
    }
    .modal-content button { background: #FFB347; border: none; padding: 12px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-right: 12px; margin-top: 12px; }
    .suggest-icons { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .suggest-icon { font-size: 1.6rem; cursor: pointer; padding: 6px 12px; border-radius: 50px; background: #2a2f45; transition: 0.1s; }
    .suggest-icon:active { background: #ffb347; transform: scale(1.05); }
    .admin-settings { background: #1f253e; border-radius: 24px; padding: 16px; margin-top: 16px; }

    @media (max-width: 760px) {
      body { padding: 16px 12px 70px 12px; }
      .sidebar { position: static; margin-bottom: 10px; }
      .item-price { white-space: normal; font-size: 1.2rem; }
      .item-row { flex-direction: column; align-items: flex-start; }
      .section-header h2 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
<div class="glow-bg"></div>

    });
    if(sidebarDiv.firstChild) sidebarDiv.firstChild.classList.add("active");
    renderMainContent(order.find(k => appData[k]) || "claude");
    if(isAdmin) document.getElementById("openAdminSettingsBtn")?.addEventListener("click", () => document.getElementById("adminSettingsModal").classList.add("active"));
  }
  
  function renderMainContent(catKey) {
    const section = appData[catKey];
    if(!section) return;
    const mainDiv = document.getElementById("mainContentArea");
    let itemsHtml = '';
    section.items.forEach((it, idx) => {
      if(it.isBank) {
        itemsHtml += `<div class="price-item bank-card"><div class="bank-inner"><div style="font-weight:800;">🏦 MB BANK</div><div>CHỦ TK: NGUYEN VAN HOA</div><div class="account-number">9125112008</div><div>📌 Nội dung: <strong>Tên + SĐT</strong></div></div></div>`;
      } else {
        const stockClass = (it.inStock === false) ? "out-of-stock" : "";
        itemsHtml += `<div class="price-item ${stockClass}" data-idx="${idx}"><div class="item-row"><div class="item-name"><span class="bullet">${it.bullet || "✨"}</span><span>${it.name}</span>${it.note ? `<span style="font-size:0.7rem; opacity:0.7;">${it.note}</span>` : ''}</div><div class="item-price">${it.price || ""}</div></div>${it.desc ? `<div class="desc-text">${it.desc}</div>` : ''}${isAdmin ? `<div class="admin-controls"><div class="stock-toggle" data-action="toggle" data-idx="${idx}"><i class="fas ${it.inStock !== false ? 'fa-toggle-on' : 'fa-toggle-off'}"></i> ${it.inStock !== false ? 'Còn hàng' : 'Tạm hết'}</div><button class="edit-btn" data-action="edit" data-idx="${idx}"><i class="fas fa-edit"></i> Sửa</button><button class="delete-btn" data-action="delete" data-idx="${idx}"><i class="fas fa-trash-alt"></i> Xóa</button></div>` : (it.inStock === false ? `<div style="margin-top:8px; color:#ff8888;"><i class="fas fa-ban"></i> Tạm thời hết hàng</div>` : '')}</div>`;
      }
    });
    if(isAdmin) itemsHtml += `<div class="add-product-btn" id="adminAddBtn"><i class="fas fa-plus-circle"></i> + Thêm sản phẩm mới</div>`;
    mainDiv.innerHTML = `<div class="section-card"><div class="section-header"><div class="header-left"><div class="icon"><i class="fas ${section.icon}"></i></div><h2>${section.title}</h2></div></div><div class="items-grid">${itemsHtml}</div></div>`;
    if(isAdmin) {
      document.querySelectorAll(".stock-toggle").forEach(el => el.addEventListener("click", () => toggleStock(catKey, parseInt(el.dataset.idx))));
      document.querySelectorAll(".edit-btn").forEach(btn => btn.addEventListener("click", () => openEditModal(catKey, parseInt(btn.dataset.idx))));
      document.querySelectorAll(".delete-btn").forEach(btn => btn.addEventListener("click", () => { if(confirm("Xóa sản phẩm?")) deleteProduct(catKey, parseInt(btn.dataset.idx)); }));
      const addBtn = document.getElementById("adminAddBtn");
      if(addBtn) addBtn.onclick = () => openAddModal(catKey);
    }
  }
  
  function toggleStock(catKey, idx) { let item = appData[catKey].items[idx]; if(item && !item.isBank) { item.inStock = !item.inStock; saveData(appData); renderMainContent(currentCategory); } }
  function deleteProduct(catKey, idx) { appData[catKey].items.splice(idx,1); saveData(appData); renderMainContent(currentCategory); }
  function openEditModal(catKey, idx) { editContext = { categoryKey: catKey, itemIndex: idx }; let item = appData[catKey].items[idx]; document.getElementById("editModalTitle").innerText = "✏️ Chỉnh sửa sản phẩm"; document.getElementById("editBullet").value = item.bullet || "✨"; document.getElementById("editName").value = item.name; document.getElementById("editDesc").value = item.desc || ""; document.getElementById("editPrice").value = item.price; document.getElementById("editNote").value = item.note || ""; document.getElementById("editModal").classList.add("active"); }
  function openAddModal(catKey) { editContext = { categoryKey: catKey, itemIndex: null }; document.getElementById("editModalTitle").innerText = "✨ Thêm sản phẩm mới"; document.getElementById("editBullet").value = "✨"; document.getElementById("editName").value = ""; document.getElementById("editDesc").value = ""; document.getElementById("editPrice").value = ""; document.getElementById("editNote").value = ""; document.getElementById("editModal").classList.add("active"); }
  
  document.getElementById("saveEditBtn").onclick = () => { let bullet = document.getElementById("editBullet").value.trim() || "✨"; let name = document.getElementById("editName").value.trim(); if(!name) { alert("Vui lòng nhập tên sản phẩm"); return; } let desc = document.getElementById("editDesc").value; let price = document.getElementById("editPrice").value; let note = document.getElementById("editNote").value; if(editContext.itemIndex !== null) { let item = appData[editContext.categoryKey].items[editContext.itemIndex]; item.bullet = bullet; item.name = name; if(desc) item.desc = desc; else delete item.desc; item.price = price; if(note) item.note = note; else delete item.note; } else { appData[editContext.categoryKey].items.push({ bullet, name, desc: desc || undefined, price, note: note || undefined, inStock: true }); } saveData(appData); document.getElementById("editModal").classList.remove("active"); renderMainContent(currentCategory); };
  document.getElementById("cancelEditBtn").onclick = () => document.getElementById("editModal").classList.remove("active");
  
  // Admin settings logic
  document.getElementById("changePassBtn")?.addEventListener("click", () => { let newPass = document.getElementById("newAdminPass").value.trim(); if(newPass) { ADMIN_PASSWORD = newPass; localStorage.setItem("admin_pass", newPass); alert("Mật khẩu admin đã thay đổi!"); document.getElementById("adminSettingsModal").classList.remove("active"); } else alert("Nhập mật khẩu mới"); });
  document.getElementById("backupDataBtn")?.addEventListener("click", () => { let dataStr = JSON.stringify(appData); let blob = new Blob([dataStr], {type: "application/json"}); let url = URL.createObjectURL(blob); let a = document.createElement("a"); a.href = url; a.download = "tainguyenmmo_backup.json"; a.click(); URL.revokeObjectURL(url); });
  document.getElementById("restoreDataBtn")?.addEventListener("click", () => { document.getElementById("restoreFileInput").click(); });
  document.getElementById("restoreFileInput")?.addEventListener("change", (e) => { let file = e.target.files[0]; if(!file) return; let reader = new FileReader(); reader.onload = function(ev) { try { let restored = JSON.parse(ev.target.result); appData = restored; saveData(appData); renderApp(); alert("Khôi phục thành công!"); document.getElementById("adminSettingsModal").classList.remove("active"); } catch(err) { alert("File lỗi!"); } }; reader.readAsText(file); });
  document.getElementById("resetDataBtn")?.addEventListener("click", () => { if(confirm("RESET toàn bộ dữ liệu về mặc định? Mất dữ liệu hiện tại!")) { appData = JSON.parse(JSON.stringify(rawSections)); saveData(appData); renderApp(); alert("Đã reset!"); document.getElementById("adminSettingsModal").classList.remove("active"); } });
  document.getElementById("closeSettingsBtn")?.addEventListener("click", () => document.getElementById("adminSettingsModal").classList.remove("active"));
  
  // Login logic
  const floatBtn = document.getElementById("adminFloatBtn");
  const loginModal = document.getElementById("loginModal");
  floatBtn.onclick = () => { if(isAdmin) { if(confirm("Đăng xuất khỏi Admin?")) { isAdmin=false; localStorage.removeItem("tainguyenmmo_admin"); renderApp(); } } else loginModal.classList.add("active"); };
  document.getElementById("submitLoginBtn").onclick = () => { let pass = document.getElementById("adminPasswordInput").value; if(pass === ADMIN_PASSWORD) { isAdmin=true; localStorage.setItem("tainguyenmmo_admin","true"); loginModal.classList.remove("active"); renderApp(); } else alert("Sai mật khẩu!"); };
  loginModal.onclick = (e) => { if(e.target === loginModal) loginModal.classList.remove("active"); };
  document.getElementById("scrollTopBtn").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
  
  // Kiểm tra admin trước đó
  if(localStorage.getItem("tainguyenmmo_admin") === "true") isAdmin = true;
  renderApp();
</script>
</body>
</html>
